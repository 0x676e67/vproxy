[package]
name = "vproxy"
version = "2.5.5"
authors = ["gngppz@gmail.com"]
description = "A high-performance HTTP/HTTPS/SOCKS5 proxy server"
repository = "https://github.com/0x676e67/vproxy"
categories = ["network-programming", "command-line-utilities"]
keywords = ["http", "https", "socks5", "proxy", "server"]
readme = "README.md"
license = "GPL-3.0"
edition = "2024"
rust-version = "1.97"
autobins = false
default-run = "vproxy"
include = [
    "/README.md",
    "/docs/**/*.md",
    "/LICENSE",
    "/build.rs",
    "/src/**/*.rs",
    "/src/manage/acme/staging-roots.pem",
    "/src/manage/contract/*.json",
    "/web/package.json",
    "/web/package-lock.json",
    "/web/tsconfig.json",
    "/web/vitest.config.mts",
    "/web/LICENSE.ant-design-pro",
    "/web/config/**",
    "/web/src/**",
    "/web/public/**",
    "/web/tools/**",
    "/web/dist/**",
    "!/web/src/**/.umi*/**",
]

[dependencies]
aya-ebpf = { version = "=0.2.1", optional = true }

# The kernel binary is no_std and must not pull the proxy, management, Web or
# allocator graph into bpf{el,eb}-unknown-none builds.
[target.'cfg(not(target_arch = "bpf"))'.dependencies]
base64 = "0.23.1"
cidr = "0.3.0"
dirs = "6.0.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "net",
    "rt",
    "macros",
    "io-util",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
self_update = { version = "=0.43.0", default-features = false, features = [
    "reqwest",
    "archive-tar",
    "compression-flate2",
] }
# self_update 0.43's rustls feature selects ring. Keep its reqwest version and roots,
# but supply AWS-LC explicitly before self-update constructs an HTTPS client.
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
    "blocking",
] }
flate2 = "1.1.10"
tar = "0.4.46"
getrandom = "0.4.3"
serde_json = "1.0.151"
sha2 = "0.11.1"
webpki-roots = "1"
fxhash = "0.2.1"
futures-util = { version = "0.3.30", default-features = false, features = ["sink"] }
pingora-runtime = "0.8.1"
socket2 = { version = "0.6.1", features = ["all"] }

# tracing
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# http
http = "1.4.0"
hyper = "1.8.1"
hyper-util = { version = "0.1.18", default-features = false, features = ["server", "http1", "client-legacy"] }
tower-service = "0.3.3"
http-body-util = "0.1.3"
rustls-pki-types = { version = "1.13.1" }
rustls-pemfile = { version = "2.2.0" }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
    "tls12",
] }
rcgen = { version = "0.14.5", default-features = false, features = ["aws_lc_rs", "pem"] }
h3 = "0.0.8"
h3-datagram = "0.0.2"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }

# socks5
bytes = "1.11.0"
smallvec = "1.15.0"
pin-project-lite = "0.2.16"
percent-encoding = "2.3.2"
sfv = { version = "0.15.0", default-features = false, features = ["parsed-types"] }

# Optional management plane. Kept out of ordinary proxy builds.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys", "alloc", "prebuilt-nasm"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"], optional = true }
argon2 = { version = "0.6.0", features = ["getrandom"], optional = true }
zeroize = { version = "1.9.0", features = ["std"], optional = true }
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
subtle = { version = "2.6.1", optional = true }
url = { version = "2.5.8", optional = true }
x509-parser = { version = "0.18.1", default-features = false, optional = true }
time = { version = "0.3.55", default-features = false, optional = true }
instant-acme = { version = "=0.8.5", default-features = false, features = ["aws-lc-rs"], optional = true }
httpdate = { version = "1", optional = true }
rust-embed = { version = "8.13.0", default-features = false, features = [
    "debug-embed",
    "deterministic-timestamps",
], optional = true }

# memory allocator
tcmalloc = { version = "0.3.0", optional = true }
snmalloc-rs = { version = "0.3.8", optional = true }
rpmalloc = { version = "0.2.2", optional = true }
jemallocator = { package = "tikv-jemallocator", version = "0.6.1", optional = true }
mimalloc = { version = "0.1.48", default-features = false, optional = true }

[build-dependencies]
aya-build = { version = "=0.2.0", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
rustix = { version = "1.1.4", default-features = false, features = ["std", "termios"], optional = true }

[target.'cfg(windows)'.dependencies]
# Safe console mode, bounded UTF-16 reads and input-queue cleanup.
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"], optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1.1.4", features = ["net"] }

[target.'cfg(all(not(target_arch = "bpf"), not(any(target_os = "linux", target_os = "android"))))'.dependencies]
quinn-udp = "0.5.14"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "=0.14.0", optional = true }
rustix = { version = "1.1.4", features = ["fs", "net", "process", "thread"] }
sysctl = "0.7.1"
rtnetlink = "0.18"
netlink-packet-route = "0.25.1"
futures = "0.3.30"
realm_io = "0.5.3"
sdjournal = "=0.1.21"
unitbus = { version = "=0.1.7", default-features = false, features = [
    "blocking",
    "config",
    "rt-tokio",
] }

[target.'cfg(any(target_os = "illumos", target_os = "ios", target_os = "macos", target_os = "solaris", target_os = "tvos", target_os = "visionos", target_os = "watchos"))'.dependencies]
nix = "0.30.1"

[features]
default = ["userspace", "mimalloc"]
userspace = []
ebpf = ["userspace", "dep:aya", "dep:aya-build"]
# Internal selection for build.rs's separate no_std kernel compilation.
ebpf-program = ["dep:aya-ebpf"]
management = [
    "userspace",
    "dep:aws-lc-rs",
    "dep:instant-acme",
    "dep:httpdate",
    "dep:rusqlite",
    "dep:argon2",
    "dep:zeroize",
    "dep:rustix",
    "dep:winsafe",
    "dep:axum",
    "dep:serde",
    "dep:serde_json",
    "dep:subtle",
    "dep:url",
    "dep:x509-parser",
    "rcgen/x509-parser",
    "rcgen/zeroize",
    "dep:time",
    "dep:sha2",
    "hyper-util/service",
    "hyper-util/tokio",
]
web-ui = [
    "management",
    "dep:rust-embed",
    "dep:sha2",
]

# Source transaction kernel only; no runtime source-protection activation yet.
witness-journal = ["management", "rusqlite/session"]
jemalloc = ["userspace", "jemallocator"]
tcmalloc = ["userspace", "tcmalloc/bundled"]
snmalloc = ["userspace", "snmalloc-rs"]
rpmalloc = ["userspace", "dep:rpmalloc"]
mimalloc = ["userspace", "dep:mimalloc"]

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["socks"] }

[[bin]]
name = "vproxy"
path = "src/main.rs"
required-features = ["userspace"]

[[bin]]
name = "vproxy-ebpf"
path = "src/bin/vproxy-ebpf.rs"
required-features = ["ebpf-program"]

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true



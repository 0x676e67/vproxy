name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  release-profiles:
    name: Native and cross release packages
    permissions:
      contents: read
    uses: ./.github/workflows/release-profiles.yml

  web-quality:
    name: Release Web quality
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: ./.github/workflows/web.yml

  style:
    name: Style
    runs-on: ubuntu-latest
    environment: Linux
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Style check
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --features management --locked -- -D warnings

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        mode: [proxy, management]

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      - name: Run proxy tests
        if: matrix.mode == 'proxy'
        run: cargo test --locked

      - name: Run management tests
        if: matrix.mode == 'management'
        run: cargo test --features management --locked

  management-msrv:
    name: Management MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97"

      - name: Test optional management without the default allocator
        run: cargo test --no-default-features --features management --locked

  masque-interop:
    name: MASQUE interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: .github/masque-interop/go.sum

      - name: Build vproxy and masque-go client
        run: |
          cargo build --locked
          mkdir -p "$RUNNER_TEMP/bin"
          go build -C .github/masque-interop -o "$RUNNER_TEMP/bin/masque-interop" .

      - name: Generate local test certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/key.pem" \
            -out "$RUNNER_TEMP/cert.pem" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,digitalSignature,keyCertSign"

      - name: Test CONNECT-UDP with masque-go
        run: |
          set -euo pipefail
          target/debug/vproxy run --bind 127.0.0.1:4433 quic \
            --tls-cert "$RUNNER_TEMP/cert.pem" \
            --tls-key "$RUNNER_TEMP/key.pem" \
            >"$RUNNER_TEMP/vproxy.log" 2>&1 &
          vproxy_pid=$!
          "$RUNNER_TEMP/bin/masque-interop" \
            -mode echo \
            -addr 127.0.0.1:4434 \
            >"$RUNNER_TEMP/udp-echo.log" 2>&1 &
          echo_pid=$!
          trap 'kill "$vproxy_pid" "$echo_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..50}; do
            if grep -q "proxy server listening" "$RUNNER_TEMP/vproxy.log" \
              && grep -q "UDP echo listening" "$RUNNER_TEMP/udp-echo.log"
            then
              ready=true
              break
            fi
            if ! kill -0 "$vproxy_pid" 2>/dev/null || ! kill -0 "$echo_pid" 2>/dev/null
            then
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/vproxy.log"
            cat "$RUNNER_TEMP/udp-echo.log"
            exit 1
          fi
          if ! timeout 30s "$RUNNER_TEMP/bin/masque-interop" \
            -mode client \
            -proxy 'https://localhost:4433/.well-known/masque/udp/{target_host}/{target_port}/' \
            -target '127.0.0.1:4434' \
            -cert "$RUNNER_TEMP/cert.pem" \
            >"$RUNNER_TEMP/client.log" 2>&1
          then
            cat "$RUNNER_TEMP/vproxy.log"
            cat "$RUNNER_TEMP/udp-echo.log"
            cat "$RUNNER_TEMP/client.log"
            exit 1
          fi
          grep -F "vproxy-masque-interop-ok" "$RUNNER_TEMP/client.log"

  build:
    name: Publish checked proxy, API, and Web archives
    runs-on: ubuntu-latest
    needs: ["style", "tests", "management-msrv", "masque-interop", "release-profiles", "web-quality"]
    environment: Linux
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.release-profiles.outputs.cross-artifact }}
          path: bin
      - name: Recheck the exact 54 assets before publication
        env:
          VPROXY_ARCHIVE_TAG: ${{ needs.release-profiles.outputs.cross-tag }}
          VPROXY_PACKAGE_VERSION: ${{ needs.release-profiles.outputs.package-version }}
        run: >-
          python .github/cross_artifacts.py --artifacts bin
          --work-dir "${{ runner.temp }}/cross-publish-check"
          --tag "$VPROXY_ARCHIVE_TAG" --version "$VPROXY_PACKAGE_VERSION" --profiles all --runtime none
      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            bin/*
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: ["style", "tests", "management-msrv", "masque-interop", "release-profiles"]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Log in to the Container registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  crates:
    name: Publish crates
    runs-on: ubuntu-latest
    environment: Linux
    needs: ["build", "style", "tests"]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Get tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tag
        uses: dawidd6/action-get-tag@v1
        with:
          strip_v: true

      - name: Tag Check
        run: |
          echo "tag=${{ steps.tag.outputs.tag }}" >> $GITHUB_ENV
          echo "tag=${{ steps.tag.outputs.tag }}" >> $GITHUB_OUTPUT
          if [ -z "${{ steps.tag.outputs.tag }}" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_ENV
          fi

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - uses: katyo/publish-crates@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
